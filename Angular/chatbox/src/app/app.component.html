<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/"><i class="fa fa-comments"></i> Chatter</a>
    <div class="d-flex align-items-center ms-auto">
      <span *ngIf="logged" class="text-white me-3 d-none d-sm-inline">Signed in as <strong>{{ authUser?.name }}</strong></span>
      <a *ngIf="!logged" class="btn btn-light btn-sm" routerLink="/login">Login</a>
      <button *ngIf="logged" class="btn btn-outline-light btn-sm" (click)="logout()">Log out</button>
    </div>
  </div>
</nav>

<div class="container my-4" *ngIf="logged && !onChat">

  <h4 class="mb-1">People</h4>
  <p class="text-muted">Pick someone to start chatting.</p>
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let user of users">
      <div class="card shadow-sm h-100" [class.border-primary]="authUser?.userId == user.userId">
        <div class="card-body d-flex align-items-center">
          <span class="avatar-circle me-3">{{ initials(user.name) }}</span>
          <div class="flex-grow-1">
            <div class="fw-semibold">{{ user.name }}
              <span *ngIf="authUser?.userId == user.userId" class="badge bg-secondary ms-1">You</span>
            </div>
            <div class="text-muted small">{{ user.email }}</div>
          </div>
          <button *ngIf="authUser && authUser.userId != user.userId" (click)="goChat(user.userId)" class="btn btn-primary btn-sm">Chat</button>
        </div>
      </div>
    </div>
  </div>







</div>

<router-outlet></router-outlet>
