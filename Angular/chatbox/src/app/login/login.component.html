<div *ngIf="authUser == null" class="wrapper">
    <div class="card">
        <div class="d-flex flex-column">
            <div class="text-center mb-2">
                <div class="brand-badge"><i class="fa fa-comments"></i></div>
                <h3 class="text-white mb-0 mt-2">Welcome to Chatter</h3>
                <small class="text-light-white">Sign in to start chatting</small>
            </div>
            <div *ngIf="error" class="alert alert-danger py-1 my-2 text-center">Invalid email or password</div>
            <div class="d-flex align-items-center input-field my-3 mb-3"> <span class="far fa-user p-2"></span> <input type="email" [(ngModel)]="user.email" (keyup.enter)="login()" placeholder="Email" required class="form-control"> </div>
            <div class="d-flex align-items-center input-field mb-4"> <span class="fas fa-lock p-2"></span> <input type="password" [(ngModel)]="user.password" (keyup.enter)="login()" placeholder="Password" required class="form-control" id="pwd"> </div>
            <div class="d-grid my-2"> <button type="submit" (click)="login()" class="btn btn-primary">Sign In</button></div>
        </div>
    </div>
</div>
