server.port=8080
server.servlet.context-path=/chatter

# In-memory H2 database (no external DB needed for local dev)
spring.datasource.url=jdbc:h2:mem:chatter;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Seed data.sql after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Browse the DB at http://localhost:8080/chatter/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
